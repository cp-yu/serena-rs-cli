description: Serena Rust adapter context with only wrapped semantic tools.
prompt: |
  Use only the semantic code tools exposed by serena-rs.

fixed_tools:
  - get_symbols_overview
  - find_symbol
  - find_declaration
  - find_referencing_symbols
  - get_diagnostics_for_file
  - rename_symbol
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol

tool_description_overrides: {}
single_project: true
